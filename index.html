
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OSWALDO ARENA</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101820;color:white;font-family:Arial}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-weight:bold;text-shadow:0 2px 5px black}
.panel{background:#102333dd;border:1px solid #54cfff;border-radius:10px;padding:10px}
#controls{position:fixed;bottom:25px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:end}
button{border:2px solid white;border-radius:50%;width:90px;height:90px;background:#d52e3c;color:white;font-weight:bold;touch-action:none}
#move{background:#14638a}
#start{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:auto;height:auto;border-radius:10px;padding:16px 25px;background:#45d9ff;color:#06131c}
#info{position:fixed;top:80px;left:12px;color:#bfeaff;font-size:12px}
</style>
</head>
<body>
<div id="hud">
 <div class="panel">OSWALDO ARENA<br>❤️ <span id="hp">100</span></div>
 <div class="panel">KILLS: <span id="kills">0</span></div>
</div>
<div id="info">SURVIVE THE ZOMBIE OUTBREAK</div>
<div id="controls">
 <button id="move">MOVE</button>
 <button id="fire">SHOOT</button>
</div>
<button id="start">ENTER THE CITY</button>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8295a8);
scene.fog=new THREE.Fog(0x8295a8,25,100);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x344433,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(10,20,10);scene.add(sun);

const material=(c)=>new THREE.MeshStandardMaterial({color:c});
function cube(w,h,d,c,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(c));
 m.position.set(x,y,z);scene.add(m);return m;
}

cube(200,1,200,0x424b4e,0,-.7,0);

// City streets
for(let i=-4;i<=4;i++){
 cube(9,.05,200,0x20262b,i*22,-.16,0);
 cube(200,.05,9,0x20262b,0,-.16,i*22);
}

// Buildings
for(let x=-4;x<=4;x++){
 for(let z=-4;z<=4;z++){
  if(Math.abs(x)<1&&Math.abs(z)<1)continue;
  const h=5+Math.random()*15;
  cube(9,h,9,[0x667786,0x71675f,0x465566][Math.floor(Math.random()*3)],
  x*22+(Math.random()-.5)*4,h/2-.1,z*22+(Math.random()-.5)*4);
 }
}

// Player
const player=new THREE.Group();scene.add(player);
const body=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,.7),material(0x168ac0));
body.position.y=1;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.35,12,10),material(0xd1aa83));
head.position.y=2;player.add(head);
const gun=new THREE.Mesh(new THREE.BoxGeometry(.2,.2,1),material(0x171c22));
gun.position.set(.45,1.2,-.7);player.add(gun);

let health=100,kills=0,playing=false,move=false,firing=false;
const zombies=[],bullets=[];
const clock=new THREE.Clock();

function zombie(){
 const a=Math.random()*Math.PI*2,d=15+Math.random()*12;
 const g=new THREE.Group();
 const b=new THREE.Mesh(new THREE.BoxGeometry(.8,1.3,.6),material(0x61874c));
 b.position.y=.8;g.add(b);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.3,10,8),material(0x78965c));
 h.position.y=1.7;g.add(h);
 g.position.set(player.position.x+Math.sin(a)*d,0,
 player.position.z+Math.cos(a)*d);
 scene.add(g);zombies.push({g,hp:2,attack:0});
}

function shoot(){
 if(!playing)return;
 const dir=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
 const origin=player.position.clone().add(new THREE.Vector3(0,1.3,0));
 const target=zombies.find(z=>z.g.position.distanceTo(player.position)<25);
 if(target){
  target.hp--;
  if(target.hp<=0){
   scene.remove(target.g);
   zombies.splice(zombies.indexOf(target),1);
   kills++;
   document.getElementById("kills").textContent=kills;
  }
 }
 const m=new THREE.Mesh(new THREE.SphereGeometry(.12,6,6),material(0xffe16b));
 m.position.copy(origin);scene.add(m);
 bullets.push({m,dir,life:.5});
}

function reset(){
 health=100;kills=0;playing=true;
 player.position.set(0,0,0);player.rotation.y=0;
 zombies.forEach(z=>scene.remove(z.g));zombies.length=0;
 bullets.forEach(b=>scene.remove(b.m));bullets.length=0;
 for(let i=0;i<5;i++)zombie();
 document.getElementById("hp").textContent=health;
 document.getElementById("kills").textContent=0;
 document.getElementById("start").style.display="none";
}

document.getElementById("start").onclick=reset;
document.getElementById("move").onpointerdown=()=>move=true;
document.getElementById("move").onpointerup=()=>move=false;
document.getElementById("move").onpointercancel=()=>move=false;
document.getElementById("fire").onpointerdown=()=>firing=true;
document.getElementById("fire").onpointerup=()=>firing=false;
document.getElementById("fire").onpointercancel=()=>firing=false;

let spawn=0,fireTime=0;
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 if(playing){
  if(move){
   player.position.x+=Math.sin(player.rotation.y)*5*dt;
   player.position.z-=Math.cos(player.rotation.y)*5*dt;
  }
  spawn-=dt;fireTime-=dt;
  if(spawn<=0&&zombies.length<12){zombie();spawn=2.5;}
  if(firing&&fireTime<=0){shoot();fireTime=.25;}

  zombies.forEach(z=>{
   const dx=player.position.x-z.g.position.x;
   const dz=player.position.z-z.g.position.z;
   const d=Math.hypot(dx,dz)||1;
   if(d>1.4){
    z.g.position.x+=dx/d*1.5*dt;
    z.g.position.z+=dz/d*1.5*dt;
    z.g.lookAt(player.position.x,0,player.position.z);
   }else{
    z.attack-=dt;
    if(z.attack<=0){
     health-=10;z.attack=.8;
     document.getElementById("hp").textContent=Math.max(0,health);
     if(health<=0){
      playing=false;
      const s=document.getElementById("start");
      s.textContent="PLAY AGAIN";s.style.display="block";
     }
    }
   }
  });

  for(let i=bullets.length-1;i>=0;i--){
   const b=bullets[i];b.m.position.addScaledVector(b.dir,45*dt);
   b.life-=dt;
   if(b.life<=0){scene.remove(b.m);bullets.splice(i,1);}
  }
 }
 const offset=new THREE.Vector3(0,6,10).applyQuaternion(player.quaternion);
 camera.position.lerp(player.position.clone().add(offset),.08);
 camera.lookAt(player.position.x,1,player.position.z);
 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
