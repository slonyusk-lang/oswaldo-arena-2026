<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>GTA: Zombie Outbreak Open-World</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100%; height: 100%; display: block; }
        
        /* Premium UI HUD */
        #hud { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
        .hud-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 12px 20px; color: #fff; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .hud-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #94a3b8; margin-bottom: 2px; }
        .hud-value { font-size: 20px; font-weight: 800; color: #f8fafc; }
        
        /* Customization Bar */
        #customizer { position: absolute; top: 80px; left: 15px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
        .select-btn { background: rgba(30, 41, 59, 0.85); border: 1px solid #38bdf8; color: #f8fafc; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; pointer-events: auto; transition: all 0.2s; }
        .select-btn:hover { background: #38bdf8; color: #0f172a; transform: translateY(-2px); }

        /* Controls UI */
        #controls-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(255, 255, 255, 0.7); font-size: 13px; text-align: center; pointer-events: none; background: rgba(0,0,0,0.5); padding: 6px 16px; border-radius: 20px; }
        #action-btn { position: absolute; bottom: 30px; right: 30px; width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #ef4444, #dc2626); border: 2px solid #fca5a5; color: white; font-weight: bold; font-size: 16px; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }
        #action-btn:active { transform: scale(0.92); }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-card">
            <div class="hud-title">Health</div>
            <div class="hud-value" id="hp-val" style="color: #4ade80;">100 %</div>
        </div>
        <div class="hud-card">
            <div class="hud-title">Zombies Eliminated</div>
            <div class="hud-value" id="score-val" style="color: #f43f5e;">0</div>
        </div>
    </div>

    <div id="customizer">
        <button class="select-btn" onclick="cycleOutfit()">Shirt Color: <span id="outfit-label">Cyber Blue</span></button>
        <button class="select-btn" onclick="cycleWeapon()">Weapon: <span id="weapon-label">Plasma Rifle</span></button>
        <button class="select-btn" onclick="cycleSpell()">Magic Spell: <span id="spell-label">Inferno Nova</span></button>
    </div>

    <div id="controls-hint">Drag screen to look left/right • WASD/Touch to Move • Tap Spell to Cast</div>
    <div id="action-btn" onclick="castSpell()">SPELL</div>

    <div id="canvas-container"></div>

    <!-- Three.js Engine & Orbit Controls -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. SCENE & GRAPHICS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050811);
        scene.fog = new THREE.FogExp2(0x050811, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // --- 2. HIGH-QUALITY LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x1e293b, 1.5);
        scene.add(ambientLight);

        const moonLight = new THREE.DirectionalLight(0x38bdf8, 2.5);
        moonLight.position.set(50, 100, 50);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 2048;
        moonLight.shadow.mapSize.height = 2048;
        moonLight.shadow.camera.near = 0.5;
        moonLight.shadow.camera.far = 200;
        moonLight.shadow.camera.left = -50;
        moonLight.shadow.camera.right = 50;
        moonLight.shadow.camera.top = 50;
        moonLight.shadow.camera.bottom = -50;
        scene.add(moonLight);

        // --- 3. OPEN WORLD GENERATION ---
        const worldSize = 300;
        const groundGeo = new THREE.PlaneGeometry(worldSize, worldSize);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8, metalness: 0.2 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Buildings & Neon Lights
        const buildingGroup = new THREE.Group();
        const colors = [0xef4444, 0x3b82f6, 0x10b981, 0x8b5cf6, 0xf59e0b];
        
        for (let i = 0; i < 60; i++) {
            const w = 10 + Math.random() * 15;
            const h = 20 + Math.random() * 50;
            const d = 10 + Math.random() * 15;
            
            const bGeo = new THREE.BoxGeometry(w, h, d);
            const bMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3, metalness: 0.7 });
            const building = new THREE.Mesh(bGeo, bMat);
            
            let x = (Math.random() - 0.5) * (worldSize - 40);
            let z = (Math.random() - 0.5) * (worldSize - 40);
            if(Math.abs(x) < 20 && Math.abs(z) < 20) continue; // Keep center clear
            
            building.position.set(x, h/2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            buildingGroup.add(building);

            // Neon roof lights
            const lightColor = colors[Math.floor(Math.random() * colors.length)];
            const pLight = new THREE.PointLight(lightColor, 3, 30);
            pLight.position.set(x, h + 2, z);
            buildingGroup.add(pLight);
        }
        scene.add(buildingGroup);

        // --- 4. PLAYER CHARACTER & WEAPONS ---
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        // Body
        const bodyGeo = new THREE.CylinderGeometry(0.5, 0.4, 1.6, 16);
        const outfitMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.5, roughness: 0.3 });
        const playerBody = new THREE.Mesh(bodyGeo, outfitMat);
        playerBody.position.y = 1;
        playerBody.castShadow = true;
        playerGroup.add(playerBody);

        // Head
        const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
        const playerHead = new THREE.Mesh(headGeo, headMat);
        playerHead.position.y = 2.0;
        playerGroup.add(playerHead);

        // Weapon Slot
        const weaponGroup = new THREE.Group();
        weaponGroup.position.set(0.6, 1.2, 0.3);
        playerGroup.add(weaponGroup);

        const weaponMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.9, roughness: 0.1 });
        const weaponMesh = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 1), weaponMat);
        weaponGroup.add(weaponMesh);

        // --- 5. SMOOTH TOUCH / DRAG CAMERA & MOVEMENT ---
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngleX = 0;
        let cameraAngleY = 0.3;

        function onPointerDown(e) {
            isDragging = true;
            previousMousePosition = { x: e.clientX || e.touches[0].clientX, y: e.clientY || e.touches[0].clientY };
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            const deltaX = clientX - previousMousePosition.x;
            const deltaY = clientY - previousMousePosition.y;

            cameraAngleX -= deltaX * 0.005;
            cameraAngleY = Math.max(0.1, Math.min(Math.PI / 3, cameraAngleY + deltaY * 0.005));

            previousMousePosition = { x: clientX, y: clientY };
        }

        function onPointerUp() { isDragging = false; }

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchstart', onPointerDown);
        window.addEventListener('touchmove', onPointerMove);
        window.addEventListener('touchend', onPointerUp);

        // Keyboard Controls
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // --- 6. ZOMBIE AI SYSTEM ---
        const zombies = [];
        const zombieGeo = new THREE.CylinderGeometry(0.4, 0.3, 1.5, 12);
        const zombieMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.9 });

        function spawnZombie() {
            if (zombies.length > 25) return;
            const zombie = new THREE.Mesh(zombieGeo, zombieMat);
            const angle = Math.random() * Math.PI * 2;
            const dist = 30 + Math.random() * 40;
            zombie.position.set(
                playerGroup.position.x + Math.cos(angle) * dist,
                0.75,
                playerGroup.position.z + Math.sin(angle) * dist
            );
            zombie.castShadow = true;
            scene.add(zombie);
            zombies.push(zombie);
        }
        setInterval(spawnZombie, 1500);

        // --- 7. CUSTOMIZATION & SPELLS INTERACTION ---
        const outfits = [{ name: "Cyber Blue", color: 0x38bdf8 }, { name: "Stealth Black", color: 0x1e293b }, { name: "Crimson Red", color: 0xef4444 }];
        let outfitIdx = 0;
        window.cycleOutfit = () => {
            outfitIdx = (outfitIdx + 1) % outfits.length;
            outfitMat.color.setHex(outfits[outfitIdx].color);
            document.getElementById('outfit-label').innerText = outfits[outfitIdx].name;
        };

        const weapons = ["Plasma Rifle", "Shotgun", "Laser Cannon"];
        let weaponIdx = 0;
        window.cycleWeapon = () => {
            weaponIdx = (weaponIdx + 1) % weapons.length;
            document.getElementById('weapon-label').innerText = weapons[weaponIdx];
        };

        const spells = ["Inferno Nova", "Frost Field", "Lightning Ring"];
        let spellIdx = 0;
        window.cycleSpell = () => {
            spellIdx = (spellIdx + 1) % spells.length;
            document.getElementById('spell-label').innerText = spells[spellIdx];
        };

        let score = 0;
        window.castSpell = () => {
            // Visual Blast Effect
            const spellGeo = new THREE.RingGeometry(0.1, 1, 32);
            const spellColors = [0xff4500, 0x00ffff, 0x9400d3];
            const spellMat = new THREE.MeshBasicMaterial({ color: spellColors[spellIdx], side: THREE.DoubleSide, transparent: true, opacity: 1 });
            const ring = new THREE.Mesh(spellGeo, spellMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.copy(playerGroup.position);
            ring.position.y = 0.1;
            scene.add(ring);

            // Blast Animation & Zombie Hits
            let scale = 1;
            const expand = setInterval(() => {
                scale += 1.5;
                ring.scale.set(scale, scale, scale);
                ring.material.opacity -= 0.05;

                // Hit detection
                for (let i = zombies.length - 1; i >= 0; i--) {
                    if (zombies[i].position.distanceTo(playerGroup.position) < scale) {
                        scene.remove(zombies[i]);
                        zombies.splice(i, 1);
                        score += 10;
                        document.getElementById('score-val').innerText = score;
                    }
                }

                if (ring.material.opacity <= 0) {
                    clearInterval(expand);
                    scene.remove(ring);
                }
            }, 30);
        };

        // --- 8. GAME LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Player Movement relative to Camera
            const moveSpeed = 12 * delta;
            let moveX = 0, moveZ = 0;

            if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

            if (moveX !== 0 || moveZ !== 0) {
                const moveVec = new THREE.Vector3(moveX, 0, moveZ).normalize();
                moveVec.applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraAngleX);
                
                playerGroup.position.addScaledVector(moveVec, moveSpeed);
                playerGroup.rotation.y = Math.atan2(moveVec.x, moveVec.z);
            }

            // Smooth Third-Person Camera Follow
            const camDist = 12;
            camera.position.x = playerGroup.position.x + camDist * Math.sin(cameraAngleX) * Math.cos(cameraAngleY);
            camera.position.y = playerGroup.position.y + camDist * Math.sin(cameraAngleY);
            camera.position.z = playerGroup.position.z + camDist * Math.cos(cameraAngleX) * Math.cos(cameraAngleY);
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.2, playerGroup.position.z);

            // Zombie AI Chasing Player
            zombies.forEach(zombie => {
                const dir = new THREE.Vector3().subVectors(playerGroup.position, zombie.position).normalize();
                zombie.position.addScaledVector(dir, 3.5 * delta);
                zombie.lookAt(playerGroup.position.x, zombie.position.y, playerGroup.position.z);
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
